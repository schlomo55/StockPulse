[tool:pytest]
# Pytest configuration for Stocks API project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --durations=10
    --color=yes

# Coverage options (if pytest-cov is installed)
# addopts = 
#     --verbose
#     --tb=short
#     --strict-markers  
#     --strict-config
#     --disable-warnings
#     --durations=10
#     --color=yes
#     --cov=app
#     --cov-report=term-missing
#     --cov-report=html:htmlcov
#     --cov-fail-under=80

# Minimum Python version
minversion = 3.8

# Test markers
markers =
    asyncio: marks tests as async (pytest-asyncio required)
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    
# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:httpx
    ignore::UserWarning:requests

# Asyncio configuration (if pytest-asyncio is installed)
asyncio_mode = auto

# Test timeout (if pytest-timeout is installed)
timeout = 300

# Log configuration for tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging during tests
log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S